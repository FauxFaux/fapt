[package]
authors = ["Chris West (Faux) <git@goeswhere.com>"]
categories = [
    "os",
    "parsing",
]
description = "Faux' apt package manager for Debian"
license = "MIT OR Apache-2.0"
name = "fapt"
readme = "README.md"
repository = "https://github.com/FauxFaux/fapt"
version = "0.1.0"

edition = "2024"

exclude = [
    "tests/lists/trusty.list",
]


[badges.appveyor]
branch = "main"
repository = "FauxFaux/fapt"
service = "github"

[features]
binaries = ["clap"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", optional = true, features = ["cargo", "derive"] }
deb-version = "0.1"
digest-io = "0.1"
directories = "6"
distro-keyring = "0.3"
filetime = "0.2"
flate2 = "1.0.12"
gpgrv = "0.5"
hex = "0.4"
insideout = "0.2"
jemallocator = { version = "0.5", optional = true }
mailparse = "0.16"
nom = "5"
reqwest = { version = "0.13", features = ["blocking"] }
sha2 = "0.11"
tempfile = "3"
tempfile-fast = "0.3"

[[bin]]
name = "fapt"
required-features = ["binaries"]
